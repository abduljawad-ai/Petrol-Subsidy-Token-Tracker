org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Network timeouts for slow dependency resolution (per handoff doc)
systemProp.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
systemProp.https.socketTimeout=180000
systemProp.https.connectionTimeout=180000


# ML Kit + R8 full mode = instant runtime failures (reflection).
# Standard-mode R8 keeps ML Kit's engine working.
android.enableR8.fullMode=false
